# OpenAI API Configuration Example
# Copy this file to openai.yaml and fill in your details

# Model configuration
model:
  type: openai  # "openai" or custom
  name: gpt-4o-mini  # Model name: gpt-4o-mini, gpt-4o, gpt-4-turbo, gpt-3.5-turbo, etc.
  
  # API credentials (alternatively set OPENAI_API_KEY environment variable)
  api_key: your-api-key-here
  
  # Optional: Custom API endpoint (for Azure or compatible APIs)
  # api_base: https://api.openai.com/v1
  
  # Optional: For Azure OpenAI
  # api_base: https://your-resource.openai.azure.com/
  # api_version: 2023-12-01-preview
  # is_azure: true
  
  # Generation parameters
  temperature: 0.0  # 0.0 = deterministic, higher = more random
  max_tokens: 100   # Maximum tokens to generate
  timeout: 30       # Request timeout in seconds

# Evaluator configuration
evaluator:
  # Which transformations to test (omit to test all)
  # Available: case, whitespace, punctuation, politeness, rephrasing,
  #            instruction, numerical, typos, context, formality
  transformations:
    - case
    - whitespace
    - punctuation
    - politeness
    - rephrasing
    - instruction
    - numerical
    - typos
    - context
    - formality
  
  # Scoring method for comparing outputs
  # Options: normalized_equal, regex, similarity, contains
  scoring_method: normalized_equal
  
  # Threshold for similarity-based scoring (0.0 to 1.0)
  scoring_threshold: 0.8

# Optional: Additional settings
# logging:
#   level: INFO
#   file: logs/evaluation.log
